<!-- Activity Popup (non-modal floating panel) -->
    <div x-show="actOpen" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
      class="fixed bottom-4 left-[272px] w-[400px] max-h-[520px] bg-white rounded-xl shadow-2xl border border-gray-200 z-50 flex flex-col overflow-hidden"
      style="box-shadow: 0 8px 30px rgba(0,0,0,0.12);">
      <!-- Header -->
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 shrink-0">
        <div class="flex items-center gap-2">
          <i class="ri-pulse-line text-brand-500"></i>
          <span class="font-semibold text-sm">Hoạt động</span>
          <span x-show="actRunning > 0" class="text-[10px] px-1.5 py-0.5 bg-brand-100 text-brand-600 rounded-full font-medium" x-text="actRunning + ' đang chạy'"></span>
        </div>
        <button @click="actOpen=false; if(page==='activity') navigate('dashboard')" class="text-gray-400 hover:text-gray-600 transition">
          <i class="ri-close-line text-lg"></i>
        </button>
      </div>
      <!-- Filter Tabs -->
      <div class="flex gap-1 px-3 py-2 border-b border-gray-50 shrink-0 overflow-x-auto">
        <template x-for="tab in [{key:'all',label:'Tất cả'},{key:'content',label:'Gen'},{key:'publish',label:'Đăng'},{key:'bulk',label:'Hàng loạt'},{key:'import',label:'Import'},{key:'system',label:'Hệ thống'}]" :key="tab.key">
          <button @click="actTab=tab.key; actCursor=null; actItems=[]; loadActivity()"
            :class="actTab===tab.key ? 'bg-brand-100 text-brand-700' : 'text-gray-500 hover:bg-gray-100'"
            class="px-2.5 py-1 text-xs font-medium rounded-md whitespace-nowrap transition" x-text="tab.label"></button>
        </template>
      </div>
      <!-- Activity List -->
      <div class="flex-1 overflow-y-auto min-h-0" @scroll.debounce.150ms="if($event.target.scrollTop+$event.target.clientHeight >= $event.target.scrollHeight - 40 && actHasMore && !actLoading) loadActivity(true)">
        <!-- Loading -->
        <div x-show="actLoading && !actItems.length" class="flex items-center justify-center py-10 text-gray-400">
          <i class="ri-loader-4-line animate-spin mr-2"></i> Đang tải...
        </div>
        <!-- Empty -->
        <div x-show="!actLoading && !actItems.length" class="flex flex-col items-center justify-center py-10 text-gray-400">
          <i class="ri-inbox-line text-3xl mb-2"></i>
          <span class="text-sm">Chưa có hoạt động nào</span>
        </div>
        <!-- Items -->
        <template x-for="a in actItems" :key="a.id">
          <div class="px-4 py-3 border-b border-gray-50 hover:bg-gray-50/50 transition">
            <div class="flex items-start gap-2.5">
              <!-- Status Icon -->
              <div class="shrink-0 mt-0.5">
                <template x-if="a.status==='running'">
                  <div class="w-5 h-5 rounded-full bg-blue-100 flex items-center justify-center">
                    <i class="ri-loader-4-line animate-spin text-blue-500 text-xs"></i>
                  </div>
                </template>
                <template x-if="a.status==='success'">
                  <div class="w-5 h-5 rounded-full bg-green-100 flex items-center justify-center">
                    <i class="ri-check-line text-green-600 text-xs"></i>
                  </div>
                </template>
                <template x-if="a.status==='error'">
                  <div class="w-5 h-5 rounded-full bg-red-100 flex items-center justify-center">
                    <i class="ri-close-line text-red-500 text-xs"></i>
                  </div>
                </template>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm text-gray-800 leading-snug" x-text="a.summary"></p>
                <div x-show="a.progress != null && a.total" class="mt-1.5">
                  <div class="flex items-center gap-2">
                    <div class="flex-1 bg-gray-200 rounded-full h-1.5 overflow-hidden">
                      <div class="bg-brand-500 h-full rounded-full transition-all duration-300" :style="'width:'+Math.round((a.progress/a.total)*100)+'%'"></div>
                    </div>
                    <span class="text-[10px] text-gray-400 shrink-0" x-text="a.progress+'/'+a.total"></span>
                  </div>
                </div>
                <p x-show="a.detail" class="text-xs text-gray-400 mt-1 line-clamp-2" x-text="a.detail"></p>
                <p x-show="a.errorCode && a.status==='error'" class="text-xs text-red-400 mt-0.5" x-text="'Mã lỗi: '+a.errorCode"></p>
                <p class="text-[10px] text-gray-300 mt-1" x-text="actTimeAgo(a.createdAt)"></p>
              </div>
              <!-- Category badge -->
              <span class="shrink-0 text-[10px] px-1.5 py-0.5 rounded-md font-medium"
                :class="{
                  'bg-purple-50 text-purple-600': a.category==='content',
                  'bg-blue-50 text-blue-600': a.category==='publish',
                  'bg-amber-50 text-amber-600': a.category==='bulk',
                  'bg-teal-50 text-teal-600': a.category==='import',
                  'bg-gray-100 text-gray-500': a.category==='system',
                }" x-text="({content:'Gen',publish:'Đăng',bulk:'Bulk',import:'Import',system:'Hệ thống'})[a.category]||a.category"></span>
            </div>
          </div>
        </template>
        <!-- Load more spinner -->
        <div x-show="actLoading && actItems.length > 0" class="flex items-center justify-center py-3 text-gray-400">
          <i class="ri-loader-4-line animate-spin text-xs mr-1"></i> <span class="text-xs">Tải thêm...</span>
        </div>
      </div>
    </div>
