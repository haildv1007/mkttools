<!-- Organization -->
<template x-if="page==='organization'">
  <div x-data="organizationPage()" x-init="init()" @organization-cleanup.window="destroy()" @popstate.window="handlePopState()" class="organization-page fade-in">
<header class="mb-5"><a href="/dashboard" class="lg:hidden text-brand-600 text-sm"><i class="ri-arrow-left-line"></i> Trở lại</a><h1 class="text-xl font-bold text-gray-900">Tổ chức & Gói</h1><p class="text-xs text-gray-400">Quản lý thông tin tổ chức, thành viên và gói dịch vụ</p></header>
  <div class="bg-slate-100/70 rounded-xl p-1 flex overflow-x-auto mb-5"><template x-for="t in tabs" :key="t.id"><button x-show="isOwner||t.id==='overview'" @click="goTab(t.id)" class="tab relative flex-none sm:flex-1 py-3 px-5 rounded-lg text-sm font-medium text-slate-500" :class="tab===t.id&&'active'"><i :class="t.icon" class="mr-2"></i><span x-text="t.label"></span></button></template></div>
  <div x-show="error" class="mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm"><i class="ri-error-warning-line mr-1"></i><span x-text="error"></span><button @click="retryLoad()" class="ml-2 underline">Thử lại</button></div>
  <div x-show="loading" class="grid md:grid-cols-2 gap-4"><div class="card p-6 h-72 skeleton"></div><div class="card p-6 h-72 skeleton"></div></div>

  <section x-show="!loading&&tab==='overview'" class="grid xl:grid-cols-[1.1fr_1fr] gap-4">
   <div class="card p-6"><div class="flex gap-4 items-start mb-7"><div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-600 text-white grid place-items-center shrink-0"><i class="ri-megaphone-fill text-3xl"></i></div><div class="min-w-0"><div class="flex items-center gap-2"><template x-if="!editingName"><h2 class="text-2xl font-bold text-slate-950 truncate" x-text="org?.name"></h2></template><button x-show="isOwner&&!editingName" @click="editName=org.name;editingName=true" class="text-slate-500"><i class="ri-pencil-line"></i></button></div><div x-show="editingName" class="flex gap-2"><input x-model="editName" class="border rounded-lg px-3 py-2"><button @click="saveName()" class="bg-brand-500 text-white px-3 rounded-lg">Lưu</button><button @click="editingName=false">Hủy</button></div><p class="text-sm text-slate-500 mt-1">Quản lý thành viên, Pages và gói dịch vụ của tổ chức.</p></div></div>
   <div class="grid sm:grid-cols-2 gap-4"><div class="bg-slate-50 rounded-xl p-4"><div class="flex gap-3"><div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 grid place-items-center"><i class="ri-facebook-circle-fill text-xl"></i></div><div class="flex-1"><p class="text-sm text-slate-500">Pages</p><b class="text-xl" x-text="usageLabel(pageUsage)"></b><div class="h-1.5 rounded bg-slate-200 mt-3"><div class="h-full rounded bg-blue-500" :style="`width:${usagePct(pageUsage)}%`"></div></div></div></div></div><div class="bg-slate-50 rounded-xl p-4"><div class="flex gap-3"><div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 grid place-items-center"><i class="ri-team-line text-xl"></i></div><div class="flex-1"><p class="text-sm text-slate-500">Thành viên</p><b class="text-xl" x-text="usageLabel(memberUsage)"></b><div class="h-1.5 rounded bg-slate-200 mt-3"><div class="h-full rounded bg-brand-500" :style="`width:${usagePct(memberUsage)}%`"></div></div></div></div></div></div></div>
   <div class="card p-6 relative overflow-hidden"><div class="relative z-10"><div class="flex justify-between gap-3"><div><p class="text-sm text-slate-500">Gói hiện tại</p><div class="flex items-center gap-2"><h2 class="text-2xl font-bold" x-text="subscription.planName||'Chưa có gói'"></h2><span class="text-xs px-2 py-1 rounded-full" :class="subStatusClass(subscription.subscriptionStatus)" x-text="subStatus(subscription.subscriptionStatus)"></span></div><p class="text-sm text-slate-500 mt-1" x-text="expiryText()"></p></div><button x-show="isOwner" @click="goTab('billing')" class="h-10 px-5 rounded-lg bg-brand-500 hover:bg-brand-600 text-white font-medium">Nâng cấp gói</button></div><div class="mt-7 space-y-4 text-sm"><p><i class="ri-check-line text-brand-500 mr-2"></i><span x-text="limitText(pageUsage.limit,'Page')"></span></p><p><i class="ri-check-line text-brand-500 mr-2"></i><span x-text="limitText(memberUsage.limit,'thành viên')"></span></p><p><i class="ri-check-line text-brand-500 mr-2"></i>Bảo vệ dữ liệu theo phạm vi tổ chức</p></div></div><i class="ri-vip-crown-fill absolute -right-8 -bottom-12 text-[180px] text-brand-100"></i></div>
  </section>

  <section x-show="!loading&&tab==='members'" class="space-y-4">
   <div class="card overflow-hidden"><div class="p-5 flex items-center justify-between"><div><h2 class="font-semibold">Danh sách thành viên</h2><p class="text-xs text-slate-500">Quản lý thành viên và phân quyền truy cập trong tổ chức</p></div><button x-show="isOwner" @click="inviteOpen=true" class="bg-brand-500 text-white px-4 py-2 rounded-lg text-sm"><i class="ri-add-line"></i> Mời thành viên</button></div><div class="overflow-x-auto"><table class="w-full text-sm min-w-[850px]"><thead class="bg-slate-50 text-slate-500"><tr><th class="text-left p-3 font-medium">Thành viên</th><th class="text-left p-3 font-medium">Vai trò</th><th class="text-left p-3 font-medium">Phạm vi truy cập</th><th class="text-left p-3 font-medium">Ngày tham gia</th><th class="text-left p-3 font-medium">Trạng thái</th><th class="text-left p-3 font-medium">Thao tác</th></tr></thead><tbody><template x-for="m in members" :key="m.id"><tr class="border-t"><td class="p-3"><div class="flex gap-3 items-center"><div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-600 grid place-items-center font-semibold" x-text="initial(m.name||m.email)"></div><div><p class="font-semibold" x-text="m.name||'Chưa đặt tên'"></p><p class="text-xs text-slate-500" x-text="m.email"></p></div></div></td><td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-semibold" :class="roleClass(m.role)" x-text="roleLabel(m.role)"></span></td><td class="p-3 text-slate-600" x-text="accessSummary(m)"></td><td class="p-3 text-slate-500" x-text="fmtDate(m.createdAt)"></td><td class="p-3"><span class="px-2 py-1 rounded-full text-xs bg-emerald-50 text-emerald-600" x-text="m.status==='ACTIVE'?'● Đang hoạt động':m.status"></span></td><td class="p-3"><span x-show="m.role==='OWNER'||m.role==='ADMIN'" class="text-xs text-slate-400">Không thể chỉnh sửa</span><div x-show="isOwner&&['MANAGER','MEMBER'].includes(m.role)" class="flex gap-2"><button @click="openPermission(m)" class="border px-3 py-2 rounded-lg hover:bg-slate-50"><i class="ri-key-2-line"></i> Quản lý quyền</button><button @click="removeMember(m)" class="border px-3 rounded-lg text-red-500" title="Xóa"><i class="ri-delete-bin-line"></i></button></div></td></tr></template><tr x-show="!members.length"><td colspan="6" class="p-10 text-center text-slate-400">Chưa có thành viên.</td></tr></tbody></table></div></div>
   <div class="card p-5"><h2 class="font-semibold mb-3">Lời mời đang chờ</h2><div x-show="!invitations.length" class="text-sm text-slate-400 py-3">Không có lời mời đang chờ.</div><div class="divide-y"><template x-for="i in invitations" :key="i.id"><div class="py-3 flex flex-wrap items-center gap-3"><div class="flex-1"><p class="font-medium text-sm" x-text="i.email"></p><p class="text-xs text-slate-500"><span x-text="roleLabel(i.role)"></span> · <span x-text="i.accessMode==='ALL'?'Toàn bộ tổ chức':'Giới hạn tài nguyên'"></span></p></div><span class="text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded-full" x-text="i.status"></span><button x-show="isOwner" @click="cancelInvite(i)" class="text-sm text-red-500">Hủy lời mời</button></div></template></div></div>
  </section>

  <section x-show="!loading&&tab==='billing'" class="billing-shell">
   <template x-if="!activeCheckout&&!checkoutLoading">
    <div class="billing-stack">
     <div class="billing-current-card">
      <div class="billing-plan-mark" x-text="initial(billing.subscription?.planName||'M')"></div>
      <div class="billing-current-main">
       <p class="billing-eyebrow">Gói hiện tại</p>
       <div class="billing-title-row"><h2 x-text="billing.subscription?.planName||'Chưa có gói'"></h2><span class="billing-status" :class="subStatusClass(billing.subscription?.status)" x-text="billing.subscription?.isTrial?'Đang dùng thử':subStatus(billing.subscription?.status)"></span></div>
       <p class="billing-muted" x-text="billingExpiryText()"></p>
      </div>
      <div class="billing-usage"><div><div class="billing-usage-label"><span>Pages</span><b x-text="usageLabel(billing.pageUsage)"></b></div><div class="billing-progress"><span :style="`width:${usagePct(billing.pageUsage)}%`"></span></div></div><div><div class="billing-usage-label"><span>Thành viên</span><b x-text="usageLabel(billing.memberUsage)"></b></div><div class="billing-progress"><span :style="`width:${usagePct(billing.memberUsage)}%`"></span></div></div></div>
     </div>

     <div>
      <div class="billing-plans-heading"><div><h2>Nâng cấp hoặc gia hạn</h2><p>Chọn gói phù hợp với nhu cầu của tổ chức. Bạn có thể thay đổi bất cứ lúc nào.</p></div><div class="billing-periods"><template x-for="period in periods" :key="period"><button @click="selectedPeriod=period" :class="selectedPeriod===period&&'is-active'" x-text="period+' tháng'"></button></template></div></div>
      <div class="billing-plan-grid"><template x-for="p in plans" :key="p.id"><article @click="selectPlan(p)" class="billing-plan-card" :class="{'is-selected':selectedPlan?.id===p.id,'is-current':isCurrentPlan(p),'is-contact':!planPriceObject(p)}">
       <div class="billing-plan-top"><h3 x-text="p.name"></h3><span x-show="isCurrentPlan(p)" class="billing-current-badge">Gói hiện tại</span><span x-show="selectedPlan?.id===p.id" class="billing-selected-icon"><i class="ri-check-line"></i></span></div>
       <div class="billing-limits"><p><i class="ri-pages-line"></i><span x-text="limitText(p.maxPages,'Pages')"></span></p><p><i class="ri-team-line"></i><span x-text="limitText(p.maxMembers,'thành viên')"></span></p></div>
       <div class="billing-price"><strong x-show="planPriceObject(p)" x-text="fmtVND(planPrice(p))"></strong><strong x-show="!planPriceObject(p)">Liên hệ để nhận báo giá</strong><span x-show="planPriceObject(p)" x-text="'/ '+selectedPeriod+' tháng'"></span></div>
       <button type="button" class="billing-plan-action" :class="selectedPlan?.id===p.id?'is-selected':isCurrentPlan(p)?'is-current':''" @click.stop="planPriceObject(p)?selectPlan(p):say('Vui lòng liên hệ quản trị viên để được tư vấn.')"><span x-text="planAction(p)"></span><i x-show="selectedPlan?.id===p.id" class="ri-check-line"></i></button>
      </article></template></div>
     </div>

     <div x-show="selectedPlan&&planPriceObject(selectedPlan)" x-transition class="billing-order-summary">
      <div class="billing-summary-plan"><div class="billing-plan-mark billing-plan-mark--small" x-text="initial(selectedPlan?.name||'M')"></div><div><p class="billing-eyebrow">Đơn hàng của bạn</p><h3 x-text="selectedPlan?.name"></h3><p x-text="limitText(selectedPlan?.maxPages,'Pages')+' · '+limitText(selectedPlan?.maxMembers,'thành viên')"></p></div></div>
      <dl><div><dt>Chu kỳ</dt><dd x-text="selectedPeriod+' tháng'"></dd></div><div><dt>Đơn giá</dt><dd x-text="fmtVND(planPrice(selectedPlan))"></dd></div><div class="billing-total"><dt>Tổng thanh toán</dt><dd x-text="fmtVND(planPrice(selectedPlan))"></dd></div></dl>
      <div class="billing-summary-action"><button @click="startCheckout()" :disabled="checkingOut||!billing.paymentEnabled"><i x-show="checkingOut" class="ri-loader-4-line animate-spin"></i><span x-text="checkingOut?'Đang tạo đơn...':'Thanh toán'"></span><i x-show="!checkingOut" class="ri-arrow-right-line"></i></button><p x-text="billing.paymentEnabled?checkoutLabel():'Thanh toán hiện chưa khả dụng.'"></p></div>
     </div>
     <div x-show="checkoutError" class="billing-error"><i class="ri-error-warning-line"></i><span x-text="checkoutError"></span></div>

     <div class="billing-history-card">
      <div class="billing-history-heading"><div><h2>Lịch sử thanh toán</h2><p>Các đơn hàng và giao dịch của tổ chức</p></div></div>
      <div x-show="!history.length" class="billing-empty">Chưa có lịch sử thanh toán.</div>
      <div class="billing-table-wrap"><table x-show="history.length" class="billing-history-table"><thead><tr><th>Mã đơn</th><th>Gói</th><th>Chu kỳ</th><th>Số tiền</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead><tbody><template x-for="o in history" :key="o.id"><tr @click="resumeOrder(o.id)" :class="o.status==='PENDING'&&'is-pending'"><td class="billing-code" x-text="o.orderCode"></td><td x-text="o.planNameSnapshot"></td><td x-text="o.billingMonths+' tháng'"></td><td class="billing-amount" x-text="fmtVND(o.amount)"></td><td><span class="billing-order-status" :class="orderStatusClass(o.status)" x-text="orderStatus(o.status)"></span></td><td x-text="fmtDateTime(o.createdAt)"></td><td><button class="billing-link" @click.stop="resumeOrder(o.id)" x-text="o.status==='PENDING'?'Tiếp tục thanh toán':o.status==='EXPIRED'?'Tạo lại thanh toán':'Xem chi tiết'"></button></td></tr></template></tbody></table></div>
     </div>
    </div>
   </template>

   <div x-show="checkoutLoading" class="billing-payment-loading"><div class="billing-qr-placeholder skeleton"></div><div><div class="skeleton h-5 w-48 rounded"></div><div class="skeleton h-4 w-72 rounded mt-3"></div></div></div>
   <template x-if="activeCheckout">
    <div class="billing-payment-view">
     <button @click="closeCheckout()" class="billing-back"><i class="ri-arrow-left-line"></i> Quay lại Gói & thanh toán</button>
     <div class="billing-payment-header"><h2>Thanh toán</h2><p>Hoàn tất thanh toán để kích hoạt gói dịch vụ</p></div>
     <div x-show="checkoutError" class="billing-error"><i class="ri-error-warning-line"></i><span x-text="checkoutError"></span></div>

     <div x-show="activeCheckout.status==='PENDING'" class="billing-payment-grid">
      <div class="billing-order-card">
       <h3>Thông tin đơn hàng</h3>
       <div class="billing-product"><div class="billing-plan-mark billing-plan-mark--small" x-text="initial(activeCheckout.planNameSnapshot||'M')"></div><div><strong x-text="activeCheckout.planNameSnapshot"></strong><p x-text="limitText(planForOrder()?.maxPages,'Pages')+' · '+limitText(planForOrder()?.maxMembers,'thành viên')"></p></div></div>
       <dl class="billing-detail-list"><div><dt>Chu kỳ</dt><dd x-text="activeCheckout.billingMonths+' tháng'"></dd></div><div><dt>Mã đơn</dt><dd class="billing-code" x-text="activeCheckout.orderCode"></dd></div><div><dt>Đơn giá</dt><dd x-text="fmtVND(activeCheckout.amount)"></dd></div><div class="billing-total"><dt>Tổng thanh toán</dt><dd x-text="fmtVND(activeCheckout.amount)"></dd></div></dl>
       <div class="billing-waiting"><span></span><div><strong>Đang chờ thanh toán...</strong><p>Đơn hàng còn hiệu lực trong <b x-text="countdown"></b></p></div></div>
      </div>
      <div class="billing-qr-card">
       <div class="billing-qr-heading"><div><h3>Thanh toán qua QR</h3><p>Quét mã bằng ứng dụng ngân hàng của bạn</p></div><span>QR Pay</span></div>
       <div class="billing-qr-wrap"><img x-show="activeCheckout.checkout?.qrUrl" :src="activeCheckout.checkout?.qrUrl" alt="Mã QR thanh toán"><div x-show="!activeCheckout.checkout?.qrUrl" class="billing-qr-placeholder skeleton"></div></div>
       <p class="billing-qr-amount">Số tiền: <strong x-text="fmtVND(activeCheckout.amount)"></strong></p>
       <p class="billing-reference">Nội dung chuyển khoản: <strong x-text="activeCheckout.checkout?.transferContent"></strong></p>
       <div class="billing-qr-actions"><a :href="activeCheckout.checkout?.qrUrl" download="mkt-tools-qr.png"><i class="ri-download-2-line"></i> Tải mã QR</a><button @click="copyTransferContent()"><i class="ri-file-copy-line"></i> Sao chép nội dung</button></div>
       <details class="billing-bank-details"><summary>Chuyển khoản ngân hàng</summary><dl><div><dt>Ngân hàng</dt><dd x-text="activeCheckout.checkout?.bankName"></dd></div><div><dt>Số tài khoản</dt><dd x-text="activeCheckout.checkout?.bankAccount"></dd></div><div><dt>Chủ tài khoản</dt><dd x-text="activeCheckout.checkout?.accountName"></dd></div></dl></details>
       <ol class="billing-instructions"><li>Mở ứng dụng ngân hàng</li><li>Quét mã QR</li><li>Kiểm tra đúng số tiền và nội dung</li><li>Hoàn tất thanh toán</li><li>MKT Tools sẽ tự động cập nhật trạng thái</li></ol>
      </div>
     </div>

     <div x-show="activeCheckout.status==='PAID'" class="billing-result billing-result--success"><div class="billing-result-icon"><i class="ri-check-line"></i></div><h2 x-text="paymentJustCompleted?'Thanh toán thành công!':'Chi tiết đơn hàng'"></h2><p><span x-show="paymentJustCompleted">Gói <strong x-text="activeCheckout.planNameSnapshot"></strong> đã được kích hoạt cho tổ chức của bạn.</span><span x-show="!paymentJustCompleted">Đơn hàng đã được thanh toán thành công.</span></p><div x-show="paymentJustCompleted" class="billing-success-sub"><div class="billing-plan-mark billing-plan-mark--small" x-text="initial(billing.subscription?.planName||activeCheckout.planNameSnapshot)"></div><div><strong x-text="billing.subscription?.planName||activeCheckout.planNameSnapshot"></strong><p x-text="limitText(billing.pageUsage?.limit,'Pages')+' · '+limitText(billing.memberUsage?.limit,'thành viên')"></p></div><span><b>Đang hoạt động</b><small x-text="billingExpiryText()"></small></span></div><div class="billing-result-actions"><button class="is-primary" @click="closeCheckout()">Quay về Gói & thanh toán</button></div><dl class="billing-order-detail"><div><dt>Mã đơn</dt><dd x-text="activeCheckout.orderCode"></dd></div><div><dt>Gói</dt><dd x-text="activeCheckout.planNameSnapshot"></dd></div><div><dt>Chu kỳ</dt><dd x-text="activeCheckout.billingMonths+' tháng'"></dd></div><div><dt>Giá snapshot</dt><dd x-text="fmtVND(activeCheckout.amount)"></dd></div><div><dt>Trạng thái</dt><dd>Đã thanh toán</dd></div><div><dt>Ngày tạo</dt><dd x-text="fmtDateTime(activeCheckout.createdAt)"></dd></div><div><dt>Ngày thanh toán</dt><dd x-text="fmtDateTime(activeCheckout.paidAt)"></dd></div></dl></div>
     <div x-show="activeCheckout.status==='EXPIRED'" class="billing-result"><div class="billing-result-icon is-muted"><i class="ri-time-line"></i></div><h2>Đơn thanh toán đã hết hạn</h2><p>Mã QR của đơn này không còn hiệu lực. Bạn có thể chủ động tạo một đơn mới.</p><div class="billing-result-actions"><button @click="closeCheckout()">Quay lại</button><button class="is-primary" @click="recreateExpiredOrder()">Tạo đơn thanh toán mới</button></div><dl class="billing-order-detail"><div><dt>Mã đơn</dt><dd x-text="activeCheckout.orderCode"></dd></div><div><dt>Gói</dt><dd x-text="activeCheckout.planNameSnapshot"></dd></div><div><dt>Tổng tiền</dt><dd x-text="fmtVND(activeCheckout.amount)"></dd></div><div><dt>Ngày tạo</dt><dd x-text="fmtDateTime(activeCheckout.createdAt)"></dd></div></dl></div>
     <div x-show="['CANCELLED','FAILED'].includes(activeCheckout.status)" class="billing-result"><div class="billing-result-icon is-muted"><i class="ri-close-line"></i></div><h2 x-text="activeCheckout.status==='CANCELLED'?'Đơn thanh toán đã hủy':'Thanh toán chưa hoàn tất'"></h2><p>Đơn hàng này không thể tiếp tục thanh toán.</p><div class="billing-result-actions"><button class="is-primary" @click="closeCheckout()">Quay về Gói & thanh toán</button></div><dl class="billing-order-detail"><div><dt>Mã đơn</dt><dd x-text="activeCheckout.orderCode"></dd></div><div><dt>Gói</dt><dd x-text="activeCheckout.planNameSnapshot"></dd></div><div><dt>Giá snapshot</dt><dd x-text="fmtVND(activeCheckout.amount)"></dd></div><div><dt>Trạng thái</dt><dd x-text="orderStatus(activeCheckout.status)"></dd></div></dl></div>
    </div>
   </template>
  </section>
<div x-show="inviteOpen" class="fixed inset-0 bg-black/40 z-50 grid place-items-center p-4" @click.self="inviteOpen=false"><div class="bg-white rounded-2xl w-full max-w-lg p-6"><div class="flex justify-between"><h2 class="text-lg font-bold">Mời thành viên</h2><button @click="inviteOpen=false"><i class="ri-close-line"></i></button></div><form @submit.prevent="sendInvite()" class="mt-5 space-y-4"><label class="block text-sm">Email<input required type="email" x-model="invite.email" class="mt-1 w-full border rounded-lg px-3 py-2.5"></label><label class="block text-sm">Vai trò<select x-model="invite.role" class="mt-1 w-full border rounded-lg px-3 py-2.5"><option>MANAGER</option><option>MEMBER</option></select></label><div><p class="text-sm mb-2">Phạm vi truy cập</p><label class="mr-5"><input type="radio" x-model="invite.accessMode" value="ALL"> Toàn bộ</label><label><input type="radio" x-model="invite.accessMode" value="RESTRICTED"> Giới hạn</label></div><p x-show="invite.accessMode==='RESTRICTED'" class="text-xs bg-amber-50 text-amber-700 p-3 rounded-lg">Bạn có thể gán Page/Nhóm sau khi thành viên chấp nhận lời mời.</p><button :disabled="saving" class="w-full bg-brand-500 text-white py-2.5 rounded-lg disabled:opacity-50">Gửi lời mời</button></form></div></div>
<div x-show="permissionOpen" class="fixed inset-0 bg-black/40 z-50 flex justify-end" @click.self="permissionOpen=false"><div class="bg-white h-full w-full max-w-xl p-6 overflow-y-auto"><div class="flex justify-between"><div><h2 class="text-lg font-bold">Quản lý quyền</h2><p class="text-sm text-slate-500" x-text="permission.member?.email"></p></div><button @click="permissionOpen=false"><i class="ri-close-line text-xl"></i></button></div><div x-show="permissionLoading" class="py-16 text-center"><i class="ri-loader-4-line animate-spin text-2xl"></i></div><div x-show="!permissionLoading" class="mt-6 space-y-5"><label class="block text-sm">Vai trò<select x-model="permission.role" class="mt-1 w-full border rounded-lg px-3 py-2.5"><option>MANAGER</option><option>MEMBER</option></select></label><div><p class="text-sm font-medium mb-2">Phạm vi truy cập</p><label class="block p-3 border rounded-lg mb-2"><input type="radio" x-model="permission.accessMode" value="ALL"> Toàn bộ tổ chức</label><label class="block p-3 border rounded-lg"><input type="radio" x-model="permission.accessMode" value="RESTRICTED"> Giới hạn tài nguyên</label></div><div x-show="permission.accessMode==='RESTRICTED'" class="space-y-5"><input x-model="resourceSearch" placeholder="Tìm Page hoặc Nhóm..." class="w-full border rounded-lg px-3 py-2"><div><h3 class="text-xs font-semibold text-slate-500 mb-2">NHÓM / WORKSPACES</h3><div class="space-y-2"><template x-for="w in filteredResources(permission.availableWorkspaces)" :key="w.id"><label class="block border rounded-lg p-3"><input type="checkbox" :value="w.id" x-model="permission.workspaceIds"> <span x-text="w.name"></span></label></template></div></div><div><h3 class="text-xs font-semibold text-slate-500 mb-2">PAGES</h3><div class="space-y-2"><template x-for="p in filteredResources(permission.availablePages)" :key="p.id"><label class="block border rounded-lg p-3"><input type="checkbox" :value="p.id" x-model="permission.pageIds"> <span x-text="p.name"></span></label></template></div></div></div><button @click="savePermission()" :disabled="saving" class="w-full bg-brand-500 text-white py-2.5 rounded-lg disabled:opacity-50">Lưu thay đổi</button></div></div></div>
<div x-show="toast" x-transition class="fixed right-5 top-5 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl z-[80] text-sm" x-text="toast"></div>
  </div>
</template>
