<!-- Campaigns -->
      <div x-show="page==='campaigns'" class="fade-in">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold">Campaigns</h2>
          <button @click="openCampaignModal()" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition flex items-center gap-2">
            <i class="ri-add-line"></i> Tạo Campaign
          </button>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="bg-gray-50 border-b border-gray-100">
                  <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Campaign</th>
                  <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Page</th>
                  <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Thời gian</th>
                  <th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Content</th>
                  <th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Lead time</th>
                  <th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Tự duyệt</th>
                  <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500 uppercase w-24"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="c in campaigns" :key="c.id">
                  <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition">
                    <td class="px-4 py-3">
                      <p class="font-medium text-gray-900" x-text="c.name"></p>
                      <p x-show="c.description" class="text-xs text-gray-400 mt-0.5 truncate max-w-[200px]" x-text="c.description"></p>
                    </td>
                    <td class="px-4 py-3">
                      <div class="flex items-center gap-2">
                        <img :src="'https://graph.facebook.com/'+(c.page?.externalId)+'/picture?type=small'" class="w-5 h-5 rounded-full" onerror="this.style.display='none'">
                        <span class="text-xs text-gray-600" x-text="c.page?.name || '—'"></span>
                      </div>
                    </td>
                    <td class="px-4 py-3 text-xs text-gray-500">
                      <span x-text="new Date(c.startDate).toLocaleDateString('vi-VN')"></span>
                      <span x-show="c.endDate"> → <span x-text="new Date(c.endDate).toLocaleDateString('vi-VN')"></span></span>
                    </td>
                    <td class="px-4 py-3 text-center">
                      <span class="text-sm font-semibold text-brand-600" x-text="c._count?.contentItems || 0"></span>
                    </td>
                    <td class="px-4 py-3 text-center">
                      <select :value="c.genLeadTime ?? 30" @change="updateCampaign(c.id, {genLeadTime: +$event.target.value})"
                        class="text-xs border rounded px-1.5 py-1 bg-white">
                        <option value="15">15 phút</option>
                        <option value="30">30 phút</option>
                        <option value="60">1 giờ</option>
                        <option value="120">2 giờ</option>
                        <option value="240">4 giờ</option>
                        <option value="480">8 giờ</option>
                        <option value="1440">24 giờ</option>
                      </select>
                    </td>
                    <td class="px-4 py-3 text-center">
                      <input type="checkbox" :checked="c.autoApprove" @change="updateCampaign(c.id, {autoApprove: $event.target.checked})"
                        class="w-4 h-4 rounded border-gray-300 text-brand-600 focus:ring-brand-500 cursor-pointer">
                    </td>
                    <td class="px-4 py-3 text-right">
                      <button @click="openCampaignModal(c)" class="text-gray-400 hover:text-brand-600 transition mr-2" title="Sửa">
                        <i class="ri-edit-line"></i>
                      </button>
                      <button @click="deleteCampaign(c)" class="text-gray-400 hover:text-red-500 transition" title="Xóa">
                        <i class="ri-delete-bin-line"></i>
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div x-show="campaigns.length === 0" class="text-center py-12 text-gray-400">
            <i class="ri-calendar-schedule-line text-4xl mb-2"></i>
            <p>Chưa có campaign nào.</p>
          </div>
        </div>
      </div>

      <!-- Campaign Modal -->
      <div x-show="showCampaignModal" class="fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4" @click.self="showCampaignModal=false">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-5 fade-in">
          <h3 class="text-lg font-bold mb-4" x-text="editingCampaign ? 'Sửa Campaign' : 'Tạo Campaign'"></h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tên Campaign *</label>
              <input x-model="campaignForm.name" type="text" placeholder="VD: Content tháng 10"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
              <textarea x-model="campaignForm.description" rows="2" placeholder="Mô tả ngắn về campaign..."
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 text-sm"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Page *</label>
              <select x-model="campaignForm.pageId" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                :disabled="currentScope.type==='page'">
                <option value="">— Chọn page —</option>
                <template x-for="p in scopePages" :key="p.id">
                  <option :value="p.id" x-text="p.name"></option>
                </template>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày bắt đầu</label>
                <input x-model="campaignForm.startDate" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 text-sm">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày kết thúc</label>
                <input x-model="campaignForm.endDate" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 text-sm">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Lead time gen</label>
                <select x-model="campaignForm.genLeadTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                  <option value="15">15 phút</option>
                  <option value="30">30 phút</option>
                  <option value="60">1 giờ</option>
                  <option value="120">2 giờ</option>
                  <option value="240">4 giờ</option>
                  <option value="480">8 giờ</option>
                  <option value="1440">24 giờ</option>
                </select>
              </div>
              <div class="flex items-end pb-1">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" x-model="campaignForm.autoApprove" class="w-4 h-4 rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                  <span class="text-sm text-gray-700">Tự động duyệt</span>
                </label>
              </div>
            </div>
            <div x-show="campaignError" class="text-red-500 text-sm" x-text="campaignError"></div>
            <div class="flex gap-3 pt-2">
              <button @click="showCampaignModal=false" class="flex-1 py-2.5 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 transition">Hủy</button>
              <button @click="saveCampaign()" class="flex-1 py-2.5 bg-brand-600 text-white rounded-lg font-medium hover:bg-brand-700 transition"
                :disabled="!campaignForm.name || !campaignForm.pageId">
                <span x-text="editingCampaign ? 'Cập nhật' : 'Tạo'"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
